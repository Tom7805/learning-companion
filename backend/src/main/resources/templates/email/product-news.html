<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::section})}">
<body>
<section>
    <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#1d1d1f;" th:text="${headline}">
        Tính năng mới
    </h1>
    <p style="margin:0 0 16px 0;">
        Chào <strong th:text="${displayName}">bạn</strong>,
    </p>
    <p style="margin:0 0 16px 0;" th:text="${body}">Nội dung bản tin.</p>
    <p style="margin:24px 0 0 0;font-size:13px;color:#6b6b70;">
        Bạn nhận thư này vì đã bật mục "Thư giới thiệu tính năng mới".
        <a th:href="${settingsUrl}" href="#" style="color:#b8371a;">Tắt nhận thư</a>
        bất cứ lúc nào, thay đổi có hiệu lực ngay.
    </p>
</section>
</body>
</html>
