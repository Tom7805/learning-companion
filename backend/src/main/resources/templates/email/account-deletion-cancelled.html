<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::section})}">
<body>
<section>
    <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;color:#1d1d1f;">
        Đã hủy yêu cầu xóa tài khoản
    </h1>
    <p style="margin:0 0 16px 0;">
        Chào <strong th:text="${displayName}">bạn</strong>, yêu cầu xóa tài khoản Learning Companion của bạn đã được hủy.
        Tài khoản hoạt động lại bình thường với nguyên dữ liệu học tập.
    </p>
    <p style="margin:0 0 16px 0;">
        Nếu không phải bạn hủy, hãy đổi mật khẩu và đăng xuất khỏi các thiết bị lạ trong mục bảo mật.
    </p>
    <p style="margin:24px 0 0 0;">
        <a th:href="${securityUrl}" href="#" style="color:#b8371a;font-weight:600;">Mở mục bảo mật</a>
    </p>
</section>
</body>
</html>
