# Môi trường phát triển: thư gửi qua bản mô phỏng, đồng hồ điều chỉnh được để thử các mốc hết hạn.
app:
  mail:
    gateway: mock
  dev-tools:
    enabled: true
  oauth:
    # Nhà cung cấp giả lập có trang cho phép quyền riêng; đặt APP_OAUTH_MODE=google để thử với Google thật.
    mode: ${APP_OAUTH_MODE:mock}
  storage:
    # Khóa chỉ dùng cho máy phát triển, môi trường thật phải đặt khóa riêng qua biến môi trường.
    encryption-key: ${APP_STORAGE_ENCRYPTION_KEY:ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=}
    signing-key: ${APP_STORAGE_SIGNING_KEY:ZGV2LW9ubHktc2lnbmluZy1rZXktb2YtMzItYnl0ZXM=}
  auth:
    # Thử tay và kiểm thử đầu cuối tạo nhiều tài khoản từ cùng một máy; môi trường thật giữ mức mặc định.
    register-limit-per-hour: 500
    resend-limit-per-hour: 500
    login-limit-per-hour: 2000
    password-reset-limit-per-hour: 500

logging:
  level:
    com.learningcompanion: DEBUG
