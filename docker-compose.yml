# Hạ tầng cho môi trường phát triển. Chạy: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: learning-companion-postgres
    environment:
      POSTGRES_DB: learning_companion
      POSTGRES_USER: learning_companion
      POSTGRES_PASSWORD: learning_companion
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_companion -d learning_companion"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
